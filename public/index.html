<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trang Bio Cá Nhân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/bio.css">
</head>

<body>
  <!-- Top navigation bar -->
  <div class="top-bar">
    <a href="/admin" class="admin-link-btn" title="Đi đến trang Quản trị">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Trang Quản Trị
    </a>
  </div>

  <!-- Dynamic Bio Card Container -->
  <div id="bio-container">
    <!-- Initial Skeleton State -->
    <main class="card">
      <div class="cover"></div>
      <header class="head">
        <div class="avatar skeleton"></div>
        <div class="skeleton skeleton-text" style="width: 60%; margin: 0 auto 10px; height: 26px;"></div>
        <div class="skeleton skeleton-text" style="width: 45%; margin: 0 auto 12px; height: 16px;"></div>
        <div class="skeleton skeleton-text" style="width: 30%; margin: 0 auto; height: 24px; border-radius: 999px;"></div>
      </header>
      <div class="actions">
        <div class="btn skeleton" style="height: 46px;"></div>
        <div class="btn skeleton" style="height: 46px;"></div>
      </div>
      <ul class="list">
        <li><div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;"><div class="skeleton skeleton-text" style="width: 40%;"></div><div class="skeleton skeleton-text" style="width: 70%;"></div></span></div></li>
        <li><div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;"><div class="skeleton skeleton-text" style="width: 40%;"></div><div class="skeleton skeleton-text" style="width: 85%;"></div></span></div></li>
      </ul>
    </main>
  </div>

  <script type="module">
    import { initBioPage } from '/js/bio.js';
    initBioPage();
  </script>
</body>

</html>
