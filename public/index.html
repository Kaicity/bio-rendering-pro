<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trang Bio Cá Nhân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/bio.css">
</head>

<body>

  <!-- Dynamic Bio Card Container -->
  <div id="bio-container">
    <!-- Initial Skeleton State -->
    <main class="card">
      <div class="cover"></div>
      <header class="head">
        <div class="avatar skeleton"></div>
        <div class="skeleton skeleton-text" style="width: 60%; margin: 0 auto 10px; height: 26px;"></div>
        <div class="skeleton skeleton-text" style="width: 45%; margin: 0 auto 12px; height: 16px;"></div>
        <div class="skeleton skeleton-text" style="width: 30%; margin: 0 auto; height: 24px; border-radius: 999px;">
        </div>
      </header>
      <div class="actions">
        <div class="btn skeleton" style="height: 46px;"></div>
        <div class="btn skeleton" style="height: 46px;"></div>
      </div>
      <ul class="list">
        <li>
          <div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;">
              <div class="skeleton skeleton-text" style="width: 40%;"></div>
              <div class="skeleton skeleton-text" style="width: 70%;"></div>
            </span></div>
        </li>
        <li>
          <div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;">
              <div class="skeleton skeleton-text" style="width: 40%;"></div>
              <div class="skeleton skeleton-text" style="width: 85%;"></div>
            </span></div>
        </li>
        <li>
          <div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;">
              <div class="skeleton skeleton-text" style="width: 35%;"></div>
              <div class="skeleton skeleton-text" style="width: 60%;"></div>
            </span></div>
        </li>
        <li>
          <div class="row"><span class="ico skeleton"></span><span class="txt" style="width: 70%;">
              <div class="skeleton skeleton-text" style="width: 45%;"></div>
              <div class="skeleton skeleton-text" style="width: 75%;"></div>
            </span></div>
        </li>
      </ul>
    </main>
  </div>

  <script type="module">
    import { initBioPage } from '/js/bio.js';
    initBioPage();
  </script>
</body>

</html>
