<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nguyễn Thị Ngọc Phú – Phòng VT-TB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #e9eef3;
      --card: #ffffff;
      --ink: #13293d;
      --muted: #5b6f82;
      --line: #dbe3ea;
      --accent: #0e6f8a;
      --accent-ink: #ffffff;
      --soft: #eaf4f7;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: 0 24px 60px -28px rgba(19, 41, 61, .35);
      animation: rise .6s cubic-bezier(.2, .7, .2, 1) both;
    }

    .cover {
      height: 112px;
      background:
        radial-gradient(circle at 85% 0%, rgba(255, 255, 255, .28), transparent 45%),
        linear-gradient(135deg, #0b4f66, #0e8aa6);
    }

    .head {
      padding: 0 28px 8px;
      text-align: center;
      margin-top: -48px
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 6px solid var(--card);
      outline: 2px solid var(--accent);
      overflow: hidden;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(19, 41, 61, 0.12);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .role {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px
    }

    .chip {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 13.5px;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 22px 28px 8px
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 12px;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex: none
    }

    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .btn.ghost {
      background: var(--soft);
      color: var(--accent)
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 16px 28px 28px
    }

    .list li {
      border-top: 1px solid var(--line)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      color: inherit;
      text-decoration: none;
    }

    .ico {
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--accent);
    }

    .ico svg {
      width: 20px;
      height: 20px
    }

    .txt {
      min-width: 0
    }

    .k {
      display: block;
      font-size: 12.5px;
      color: var(--muted)
    }

    .v {
      display: block;
      font-size: 15.5px;
      font-weight: 500;
      overflow-wrap: anywhere
    }

    a.row:hover .v {
      color: var(--accent)
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 12px
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .card {
        animation: none
      }

      .btn {
        transition: none
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="cover" aria-hidden="true"></div>
    <header class="head">
      <div class="avatar">
        <img src="assets/images/avatar.jpg" alt="Nguyễn Thị Ngọc Phú">
      </div>
      <h1>Nguyễn Thị Ngọc Phú</h1>
      <p class="role">Phòng Kế Hoạch Đấu Thầu</p>
      <span class="chip">Trung Nam EC</span>
    </header>

    <div class="actions">
      <a class="btn primary" href="tel:0967827848">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
        </svg>
        Gọi điện
      </a>
      <a class="btn ghost" href="mailto:phuntn@trungnamgroup.com.vn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-10 6L2 7" />
        </svg>
        Gửi email
      </a>
    </div>

    <ul class="list">
      <li>
        <a class="row" href="tel:0967827848">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="2" width="12" height="20" rx="3" />
              <path d="M11 18h2" />
            </svg></span>
          <span class="txt"><span class="k">Số điện thoại</span><span class="v">0967 827 848</span></span>
        </a>
      </li>
      <li>
        <a class="row" href="mailto:phuntn@trungnamgroup.com.vn">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-10 6L2 7" />
            </svg></span>
          <span class="txt"><span class="k">Email</span><span class="v">phuntn@trungnamgroup.com.vn</span></span>
        </a>
      </li>
      <li>
        <div class="row">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" />
            </svg></span>
          <span class="txt"><span class="k">Phòng ban</span><span class="v">P. KHĐT</span></span>
        </div>
      </li>
    </ul>
  </main>
</body>

</html>
