services:
  - type: web
    name: bio-rendering
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: APP_URL
        sync: false
